<ppa-auth-frame [heading]="heading()">
  @switch (state()) {
    @case ('choosing') {
      @if (feedback().notice; as notice) {
        <pp-notice tone="danger" announce>{{ notice }}</pp-notice>
      }
      <form class="form" [formGroup]="form" (ngSubmit)="save()" novalidate>
        <pp-field
          label="New password"
          hint="Use at least 12 characters."
          [error]="feedback().fields.newPassword"
        >
          <input
            pp-text-field
            type="password"
            autocomplete="new-password"
            formControlName="newPassword"
          />
        </pp-field>
        <div class="actions">
          <button pp-button variant="primary" type="submit" [busy]="busy()">Save password</button>
        </div>
      </form>
    }
    @case ('changed') {
      <div class="step">
        <p class="lead">Sign in with your new password.</p>
        <div class="actions">
          <a pp-button variant="primary" routerLink="/sign-in">Sign in</a>
        </div>
      </div>
    }
    @case ('invalid') {
      <div class="step">
        <p class="lead">
          A reset link works once, and not for long. Ask for a new one and use it soon after it
          arrives.
        </p>
        <div class="actions">
          <a pp-button variant="primary" routerLink="/forgot-password">Send a new link</a>
        </div>
      </div>
    }
  }
</ppa-auth-frame>
